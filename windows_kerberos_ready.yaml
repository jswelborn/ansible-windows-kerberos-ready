---
- name: Wait for Windows Kerberos readiness
  hosts: all
  gather_facts: false

  tasks:
    - name: Validate Kerberos variables
      ansible.builtin.assert:
        that:
          - ansible_user is defined
          - ansible_user | length > 0
          - ansible_password is defined
          - ansible_password | length > 0
          - ansible_winrm_transport is defined
          - ansible_winrm_transport == "kerberos"
        fail_msg: Missing ansible_user, ansible_password, or Kerberos transport

    - name: Show Kerberos non-secret variables
      ansible.builtin.debug:
        msg:
          ansible_user: "{{ ansible_user }}"
          ansible_host: "{{ ansible_host }}"
          ansible_winrm_transport: "{{ ansible_winrm_transport }}"

    - name: Validate kinit with injected AAP credential
      ansible.builtin.expect:
        command: /usr/bin/kinit -V "{{ ansible_user }}"
        responses:
          (?i)password.*: "{{ ansible_password }}"
        timeout: 60
      no_log: true
      changed_when: false

    - name: Show Kerberos ticket
      ansible.builtin.command: /usr/bin/klist
      register: kerberos_ticket
      changed_when: false

    - name: Display Kerberos ticket summary
      ansible.builtin.debug:
        var: kerberos_ticket.stdout_lines

    - name: Wait for first Kerberos WinRM connection
      ansible.windows.win_shell: hostname
      register: kerberos_ready_1
      retries: 30
      delay: 10
      until: kerberos_ready_1 is succeeded
      changed_when: false

    - name: Reset Kerberos connection
      ansible.builtin.meta: reset_connection

    - name: Wait before second Kerberos validation
      ansible.builtin.pause:
        seconds: 15

    - name: Validate second Kerberos WinRM connection
      ansible.windows.win_shell: hostname
      register: kerberos_ready_2
      retries: 12
      delay: 10
      until: kerberos_ready_2 is succeeded
      changed_when: false

    - name: Reset Kerberos connection again
      ansible.builtin.meta: reset_connection

    - name: Wait before final Kerberos validation
      ansible.builtin.pause:
        seconds: 15

    - name: Validate final Kerberos WinRM connection
      ansible.windows.win_shell: hostname
      register: kerberos_ready_3
      retries: 12
      delay: 10
      until: kerberos_ready_3 is succeeded
      changed_when: false