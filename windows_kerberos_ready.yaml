---
- name: Wait for Windows Kerberos readiness
  hosts: all
  gather_facts: false

  vars:
    kerberos_dns_retries: "{{ 45 if cloud_provider | default('') == 'aws' else 30 }}"
    kerberos_dns_delay: 20
    kerberos_winrm_timeout: "{{ 1200 if cloud_provider | default('') == 'aws' else 600 }}"

  tasks:
    - name: Set Kerberos password variable from available credential vars
      ansible.builtin.set_fact:
        kerberos_password: "{{ ansible_password | default(ansible_ssh_pass | default('')) }}"

    - name: Validate Kerberos variables
      ansible.builtin.assert:
        that:
          - ansible_user is defined
          - ansible_user | length > 0
          - kerberos_password is defined
          - kerberos_password | length > 0
          - ansible_winrm_transport is defined
          - ansible_winrm_transport == "kerberos"
          - ansible_host is defined
          - ansible_host | length > 0
        fail_msg: Missing ansible_user, password, ansible_host, or Kerberos transport

    - name: Show Kerberos non-secret variables
      ansible.builtin.debug:
        msg:
          ansible_user: "{{ ansible_user }}"
          ansible_host: "{{ ansible_host }}"
          ansible_connection: "{{ ansible_connection | default('undefined') }}"
          ansible_winrm_transport: "{{ ansible_winrm_transport }}"
          ansible_winrm_kinit_mode: "{{ ansible_winrm_kinit_mode | default('undefined') }}"
          ansible_password_defined: "{{ ansible_password is defined }}"
          ansible_ssh_pass_defined: "{{ ansible_ssh_pass is defined }}"

    - name: Wait for DNS record to resolve from execution node
      ansible.builtin.command: "getent hosts {{ ansible_host }}"
      delegate_to: localhost
      register: dns_lookup
      retries: "{{ kerberos_dns_retries | int }}"
      delay: "{{ kerberos_dns_delay }}"
      until: dns_lookup.rc == 0
      changed_when: false

    - name: Validate kinit with injected AAP credential
      ansible.builtin.shell: |
        printf '%s\n' "{{ kerberos_password }}" | /usr/bin/kinit -V "{{ ansible_user }}"
      delegate_to: localhost
      register: kinit_result
      retries: 5
      delay: 15
      until: kinit_result.rc == 0
      changed_when: false
      no_log: true

    - name: Show Kerberos ticket
      ansible.builtin.command: /usr/bin/klist
      delegate_to: localhost
      register: kerberos_ticket
      changed_when: false

    - name: Display Kerberos ticket summary
      ansible.builtin.debug:
        var: kerberos_ticket.stdout_lines

    - name: Wait for Kerberos WinRM transport to become available
      ansible.builtin.wait_for_connection:
        delay: 60
        timeout: "{{ kerberos_winrm_timeout | int }}"

    - name: Validate first Kerberos WinRM command
      ansible.windows.win_shell: hostname
      register: kerberos_ready_1
      retries: 30
      delay: 20
      until: kerberos_ready_1 is succeeded
      changed_when: false

    - name: Reset Kerberos connection
      ansible.builtin.meta: reset_connection

    - name: Wait before second Kerberos validation
      ansible.builtin.pause:
        seconds: 30

    - name: Validate second Kerberos WinRM command
      ansible.windows.win_shell: hostname
      register: kerberos_ready_2
      retries: 18
      delay: 20
      until: kerberos_ready_2 is succeeded
      changed_when: false

    - name: Reset Kerberos connection again
      ansible.builtin.meta: reset_connection

    - name: Wait before final Kerberos validation
      ansible.builtin.pause:
        seconds: 30

    - name: Validate final Kerberos WinRM command
      ansible.windows.win_shell: hostname
      register: kerberos_ready_3
      retries: 18
      delay: 20
      until: kerberos_ready_3 is succeeded
      changed_when: false